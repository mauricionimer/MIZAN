name: Keep Alive

# Reserva do despertador. O principal é externo (cron-job.org, a cada 5 minutos):
# o GitHub atrasa tarefas agendadas e, na prática, esta roda de 3 em 3 horas ou
# mais, e o Render grátis dorme após 15 minutos sem visita.
# Ver docs/SERVIDOR_SEMPRE_LIGADO.md.

on:
  schedule:
    - cron: '*/8 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping backend
        run: |
          curl -sf --max-time 90 https://mizan-backend-4zg8.onrender.com/health \
            && echo "Backend respondeu OK" \
            || echo "Backend não respondeu (normal se estava dormindo)"
