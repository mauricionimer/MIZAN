services:
  - type: web
    name: mizan-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      # Sem esta, o backend se recusa a subir: as credenciais de banco dos
      # clientes seriam gravadas em texto puro. Gere com
      #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - key: MIZAN_ENCRYPTION_KEY
        sync: false
